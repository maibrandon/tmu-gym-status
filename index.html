<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdfdfc" />
    <script>
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('tmu-appearance');
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch {}
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.appearance = preference;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = dark ? '#181818' : '#fdfdfc';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#181818' : '#fdfdfc';
      })();
    </script>
    <meta name="description" content="Check current occupancy across all six TMU gym spaces, at a glance." />
    <title>Mac or Rac?</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
